# Git hook configuration executed by prek (sequential formatters before read-only checks)
exclude: "^(cache|data|outputs|tmp|tools|\\.venv)/"

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
        require_serial: true

      - id: shfmt
        name: shfmt
        entry: shfmt -w -i 2 -ci
        language: system
        files: ^scripts/.*\.sh$
        exclude: ^scripts/check-docs\.sh$
        require_serial: true

      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check
        language: system
        types: [python]

      - id: pyright
        name: pyright
        entry: pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: tach-check
        name: tach check
        entry: tach check
        language: system
        types: [python]
        pass_filenames: false

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: ^scripts/.*\.sh$
        exclude: ^scripts/check-docs\.sh$

      - id: check-docs
        name: check-docs
        entry: ./scripts/check-docs.sh
        language: system
        files: (^docs-check\.conf$|\.(md|yaml)$)
        pass_filenames: false
