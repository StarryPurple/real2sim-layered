# Vale configuration for prose-standard enforcement (from better-docs).
# Auto-discovered by scripts/check-docs.sh at `.vale.ini`.
StylesPath = .vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = BetterDocs

[{**/,}vendor/**]
BasedOnStyles =

[{**/,}node_modules/**]
BasedOnStyles =

[{**/,}.agents/notes/archived/**]
BasedOnStyles =

[{**/,}.agents/scratch/**]
BasedOnStyles =

[{**/,}skills/prose-standard/references/**]
BasedOnStyles =

[{**/,}.agents/skills/prose-standard/references/**]
BasedOnStyles =
