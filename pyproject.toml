[project]
name = "real2sim-layered"
version = "0.1.0"
description = "Layered common-sense Real2Sim agent with local physics escalation and anomaly fallback"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "mujoco>=3.3.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=11.0.0",
    "trimesh>=4.6.0",
    "imageio>=2.36.0",
    "imageio-ffmpeg>=0.6.0",
    "huggingface-hub>=0.29.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "openai>=1.60.0",
    "matplotlib>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "ast-grep-cli>=0.51.3",
    "deptry>=0.25.1",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "vulture>=2.16",
]
vlm = [
    "transformers>=5.0.0",
    "accelerate>=1.10.0",
    "qwen-vl-utils>=0.0.14",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]
geom3d = [
    "coacd>=1.0.0",
    "diffusers>=0.32.0",
    "scikit-image>=0.24.0",
    "einops>=0.8.0",
    "omegaconf>=2.3.0",
    "timm>=1.0.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/real2sim_layered"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests"]
extend-exclude = ["/cache", "/data", "/outputs", "/tmp", "/tools"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "C90",
    "T20",
    "ARG",
    "ERA",
    "PIE",
    "PERF",
    "PLR",
    "PT",
]
ignore = [
    "E501",     # Line length is enforced by ruff format
    "PLR2004",  # Numeric physics/geometry constants in expressions are intentional
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"src/real2sim_layered/cli.py" = ["T201"]  # CLI entrypoint prints user-facing tables/status
"scripts/*.py" = ["T201"]  # CLI helper scripts print status output
"tests/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["src", "scripts", "tests"]
exclude = [
    "cache",
    "data",
    "outputs",
    "tmp",
    "tools",
    ".venv",
    "src/real2sim_layered/sim/blender_worker.py",  # Runs inside Blender 4.2 embedded Python (bpy)
]

[tool.vulture]
paths = ["src", "scripts"]
min_confidence = 80
exclude = ["src/real2sim_layered/sim/blender_worker.py"]

[tool.deptry]
known_first_party = ["real2sim_layered"]
optional_dependencies_dev_groups = ["dev"]
extend_exclude = [
    "cache",
    "data",
    "outputs",
    "tmp",
    "tools",
    "src/real2sim_layered/sim/blender_worker.py",
]

[tool.deptry.per_rule_ignores]
# transformers/Hunyuan3D runtime plugins and reserved Layer 2-3 media/vision deps
DEP002 = [
    "accelerate",
    "diffusers",
    "einops",
    "omegaconf",
    "qwen-vl-utils",
    "scikit-image",
    "timm",
    "torchvision",
    "pyyaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
